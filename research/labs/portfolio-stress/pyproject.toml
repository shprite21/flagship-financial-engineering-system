[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-asset-risk-simulation"
version = "1.0.0"
description = "Correlated Gaussian portfolio simulation and covariance stress research"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.4"]
notebooks = ["jupyterlab>=4", "yfinance>=0.2", "scikit-learn>=1.4", "statsmodels>=0.14"]

[project.scripts]
risk-sim = "risk_engine.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
