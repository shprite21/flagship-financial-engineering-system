[project]
name = "systematic-equities-research-lab"
version = "0.1.0"
description = "Institutional-style multi-factor systematic equities research and portfolio construction framework."
requires-python = ">=3.10"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
strict_optional = true

